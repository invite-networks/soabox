[package]
name = "soabox"
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
description = "Web interface and PowerDNS-compatible API gateway for PowerDNS Authoritative 5.x"
license = "Apache-2.0"
repository = "https://github.com/invite-networks/soabox"
publish = false

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["cookie", "typed-header"] }
base64 = "0.23.1"
bytes = "1.12"
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.8", features = ["derive", "env"] }
dotenvy = "0.15.7"
getrandom = "0.4.3"
hex = "0.4.3"
hmac = "0.13.0"
http = "1.5.0"
ipnet = "2.12.2"
openidconnect = { version = "4.1.0", default-features = false, features = ["reqwest", "rustls-tls"] }
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "http2", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha1 = "0.11.0"
sha2 = "0.11.1"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "tls-rustls", "any", "sqlite", "postgres", "migrate", "macros"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1.54.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util", "timeout"] }
tower-http = { version = "0.7.1", features = ["trace", "fs", "limit", "set-header", "request-id", "util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.8"
utoipa = { version = "6.0.0", features = ["axum_extras", "preserve_order"] }
uuid = { version = "1.29.3", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1.5"
rstest = "0.28.0"
tempfile = "3.27.0"
wiremock = "0.6.5"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
