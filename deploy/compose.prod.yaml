# Example production deployment with Postgres. Copy next to a .env file.
# Put a TLS-terminating reverse proxy in front of port 8080 and set
# SOABOX_TRUSTED_PROXIES to its address. The PowerDNS API is not published.
name: soabox

services:
  soabox:
    # Tracks the newest release. To hold a deployment on one release, use a
    # version tag such as ghcr.io/invite-networks/soabox:0.2.1.
    image: ghcr.io/invite-networks/soabox:latest
    env_file: .env
    environment:
      SOABOX_MODE: prod
      SOABOX_PDNS_URL: http://pdns:8081
      SOABOX_DATABASE_URL: postgres://soabox:${POSTGRES_PASSWORD:?}@postgres/soabox
    volumes:
      - ./data/soabox:/app/data
    ports:
      # Published on localhost for a reverse proxy on the same host. Use an
      # internal network instead if the proxy runs elsewhere.
      - "127.0.0.1:8080:8080"
    read_only: true
    depends_on:
      - postgres
      - pdns
    restart: unless-stopped

  postgres:
    image: postgres:18@sha256:e754b839f447639b7004895f4d8a4bfcb4e9dbe3a1bc035f27f646562a16fd61
    environment:
      POSTGRES_USER: soabox
      POSTGRES_DB: soabox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - ./data/postgres:/var/lib/postgresql
    restart: unless-stopped

  pdns-init:
    image: powerdns/pdns-auth-51:5.1.5@sha256:77ff4efdbb9ec30e9309c8a1cbed6121a67fa3be25c848bbbfa756fc75bf9a27
    # Runs once as root only to create the PowerDNS database and hand the
    # directory to the pdns user (UID 953) inside the image.
    user: "0"
    entrypoint:
      - sh
      - -c
      - >-
        [ -f /var/lib/powerdns/pdns.sqlite3 ] ||
        sqlite3 /var/lib/powerdns/pdns.sqlite3 < /usr/local/share/doc/pdns/schema.sqlite3.sql;
        chown -R 953:953 /var/lib/powerdns
    volumes:
      - ./data/pdns:/var/lib/powerdns
    restart: "no"

  pdns:
    image: powerdns/pdns-auth-51:5.1.5@sha256:77ff4efdbb9ec30e9309c8a1cbed6121a67fa3be25c848bbbfa756fc75bf9a27
    environment:
      PDNS_AUTH_API_KEY: ${PDNS_AUTH_API_KEY:?}
    volumes:
      - ./data/pdns:/var/lib/powerdns
    depends_on:
      pdns-init:
        condition: service_completed_successfully
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    restart: unless-stopped
