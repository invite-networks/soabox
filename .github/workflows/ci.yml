name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: soabox
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      oidc:
        image: ghcr.io/navikt/mock-oauth2-server:2.1.10
        env:
          JSON_CONFIG: '{"interactiveLogin":false}'
        ports: ["28080:8080"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: backend
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: cargo-nextest@0.9,cargo-llvm-cov@0.6
      - name: Start PowerDNS for the compatibility suite
        working-directory: .
        run: |
          printf 'PDNS_AUTH_API_KEY=ci-pdns-key\nSOABOX_MODE=dev\nSOABOX_PUBLIC_URL=http://localhost:8080\nSOABOX_PDNS_API_KEY=ci-pdns-key\nSOABOX_SECRET_KEY=%s\n' "$(openssl rand -base64 32)" > .env
          mkdir -p data/pdns
          docker compose up -d --wait pdns
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Tests with coverage gate
        env:
          SOABOX_TEST_POSTGRES_URL: postgres://postgres:ci@localhost:5432/soabox
          SOABOX_COMPAT_PDNS_URL: http://localhost:8081
          SOABOX_COMPAT_PDNS_KEY: ci-pdns-key
          SOABOX_TEST_OIDC_ISSUER: http://localhost:28080/default
        run: cargo llvm-cov nextest --test-threads 1 --fail-under-lines 80
      - run: cargo test --doc
      - name: OpenAPI spec is up to date
        run: |
          cargo run --quiet -- openapi > /tmp/openapi.json
          diff -u openapi.json /tmp/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm audit
      - name: API types match the backend OpenAPI spec
        run: node scripts/check-api-types.mjs ../backend/openapi.json

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - run: corepack enable
      - run: cd frontend && pnpm install --frozen-lockfile
      - name: End-to-end tests against the real stack
        run: |
          printf 'PDNS_AUTH_API_KEY=ci-pdns-key\nSOABOX_MODE=prod\nSOABOX_PUBLIC_URL=http://localhost:8080\nSOABOX_PDNS_API_KEY=ci-pdns-key\nSOABOX_SECRET_KEY=%s\nSOABOX_BOOTSTRAP_ADMIN_USERNAME=admin\nSOABOX_BOOTSTRAP_ADMIN_PASSWORD=%s\n' "$(openssl rand -base64 32)" "$(openssl rand -hex 16)" > .env
          scripts/e2e.sh
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: frontend/playwright-report

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Scan history for secrets
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --verbose

  supply-chain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.19.8
      - run: cargo audit
      - run: cargo deny check
      - name: 72 hour release cooldown
        working-directory: .
        run: |
          git show origin/main:backend/Cargo.lock > /tmp/base.lock 2>/dev/null || : > /tmp/base.lock
          python3 scripts/cargo-cooldown.py backend/Cargo.lock 72 /tmp/base.lock

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: soabox:ci
          build-args: SOABOX_GIT_SHA=${{ github.sha }}
      - name: Image runs as UID 1001
        run: test "$(docker image inspect soabox:ci --format '{{.Config.User}}')" = "1001:1001"
      - name: Scan the image for vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.71.0 image --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 soabox:ci
