[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Fail on unmaintained crates we depend on directly. Transitive ones (for
# example chrono through openidconnect, RUSTSEC-2026-0543) are reported by
# cargo audit. chrono comes only from openidconnect; review by 2027-02-19.
unmaintained = "workspace"
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa is used only for public-key signature verification of OIDC ID tokens; the Marvin attack targets private-key operations; review by 2027-02-19" },
]

[licenses]
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "0BSD",
    "BSL-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
