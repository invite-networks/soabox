name: Release

# Pushing a version tag such as v0.2.1 runs the full CI suite on that commit,
# then builds, checks, and publishes the image to GHCR as 0.2.1, 0.2, and
# latest. Prerelease tags such as v1.0.0-rc.1 publish only their own tag.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Tag matches the backend and frontend versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(grep -m1 '^version' backend/Cargo.toml | cut -d'"' -f2)
          app=$(node -p "require('./frontend/package.json').version")
          if [ "$tag" != "$crate" ] || [ "$tag" != "$app" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match backend $crate and frontend $app"
            exit 1
          fi

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build the image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: soabox:release
          labels: ${{ steps.meta.outputs.labels }}
          build-args: SOABOX_GIT_SHA=${{ github.sha }}

      - name: Image runs as UID 1001
        run: test "$(docker image inspect soabox:release --format '{{.Config.User}}')" = "1001:1001"

      - name: Image reports the tagged version
        run: docker run --rm soabox:release --version | grep -F "${GITHUB_REF_NAME#v}"

      - name: Scan the image for vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 soabox:release

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: push
        name: Publish to GHCR
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: SOABOX_GIT_SHA=${{ github.sha }}

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Summary
        run: |
          {
            echo "### Published ${IMAGE}"
            echo
            echo "Digest: \`${{ steps.push.outputs.digest }}\`"
            echo
            echo '${{ steps.meta.outputs.tags }}' | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
