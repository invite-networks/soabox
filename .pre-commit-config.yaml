repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: rustfmt
        name: rustfmt
        entry: bash -c 'cd backend && cargo fmt --check'
        language: system
        files: ^backend/.*\.rs$
        pass_filenames: false
      - id: clippy
        name: clippy
        entry: bash -c 'cd backend && cargo clippy --all-targets -- -D warnings'
        language: system
        files: ^backend/
        pass_filenames: false
      - id: biome
        name: biome
        entry: bash -c 'cd frontend && pnpm exec biome check --error-on-warnings .'
        language: system
        files: ^frontend/
        pass_filenames: false
      - id: tsc
        name: typecheck
        entry: bash -c 'cd frontend && pnpm typecheck'
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false
